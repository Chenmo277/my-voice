<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机端语音识别</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f7; padding: 20px; }
        #display { width: 100%; max-width: 400px; min-height: 100px; background: white; border-radius: 12px; padding: 16px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 1.1rem; color: #333; }
        #talkBtn { width: 120px; height: 120px; border-radius: 50%; border: none; background: #007aff; color: white; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 12px rgba(0,122,255,0.4); transition: 0.2s; }
        #talkBtn.recording { background: #ff3b30; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        #status { margin-top: 16px; font-size: 0.9rem; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div id="display">点击按钮开始录音…</div>
    <button id="talkBtn">按下录音</button>
    <div id="status">等待中</div>

    <script>
        const display = document.getElementById('display');
        const talkBtn = document.getElementById('talkBtn');
        const status = document.getElementById('status');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        talkBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        status.textContent = '识别中，请稍候…';
                        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                        
                        // 改用 Hugging Face 提供的免费无 CORS 限制接口
                        const formData = new FormData();
                        formData.append('file', audioBlob, 'audio.webm');

                        try {
                            const response = await fetch('https://api-inference.huggingface.co/models/openai/whisper-tiny', {
                                method: 'POST',
                                body: audioBlob
                            });
                            
                            if (!response.ok) throw new Error('网络状态码: ' + response.status);

                            const result = await response.json();
                            
                            if (result && result.text) {
                                display.textContent = '识别结果：' + result.text;
                                status.textContent = '识别完成';
                            } else {
                                display.textContent = '未识别到文本';
                                status.textContent = '失败';
                            }
                        } catch (error) {
                            display.textContent = '识别失败。';
                            status.textContent = '提示：可能因为音频格式不被服务器接受。';
                            console.error(error);
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    talkBtn.textContent = '停止录音';
                    talkBtn.classList.add('recording');
                    status.textContent = '正在聆听…';
                    display.textContent = '请对着手机说话…';

                } catch (err) {
                    display.textContent = '无法获取麦克风权限！';
                    status.textContent = '请检查手机设置。';
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                talkBtn.textContent = '按下录音';
                talkBtn.classList.remove('recording');
            }
        });
    </script>
</body>
</html>
